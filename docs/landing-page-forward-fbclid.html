<!--
  ============================================================
  BEST OPTION: don't use this file.
  Point the ad straight at https://ffidunban.com

  skillon056.systeme.io/idunban does nothing except redirect
  there. Removing it keeps fbclid automatically, and drops a
  hop that costs load time and visitors.

  Only keep the systeme.io hop if the ad was approved with
  that URL and you don't want to re-trigger review.
  ============================================================

  If you DO keep it, paste this in the page's
  Settings -> Custom code -> HEADER  (not the footer).

  The footer is too late: systeme.io's own auto-redirect has
  already fired by then, which is why nothing changed. Running
  from the header lets us do the redirect first, with the ad's
  click id still attached.
-->
<script>
(function () {
  var qs = window.location.search;
  if (!qs || qs.length < 2) return; // no params — let systeme.io redirect

  try {
    var target = new URL("https://ffidunban.com/");
    new URLSearchParams(qs).forEach(function (value, key) {
      if (!target.searchParams.has(key)) target.searchParams.set(key, value);
    });
    // replace(), not href — the ad click shouldn't leave a back-button trap.
    window.location.replace(target.toString());
  } catch (e) {
    /* leave systeme.io's own redirect to handle it */
  }
})();
</script>
